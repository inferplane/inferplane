<text x="167" y="523" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="23" font-weight="700" fill="#163c2c" text-anchor="middle">코딩 에이전트</text>
<text x="167" y="552" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="middle">Claude Code · Codex</text>
<text x="167" y="579" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="middle">OpenCode · 가상 키</text>
<text x="527" y="480" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="25" font-weight="700" fill="#163c2c" text-anchor="middle">mayu</text>
<text x="378" y="511" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="start">1  접근 제어 + 로컬 PII 검사</text>
<text x="378" y="540" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="start">2  개인정보·예산·컨텍스트</text>
<text x="378" y="569" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="start">3  공급자 시도마다 사전 승인</text>
<text x="378" y="598" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="start">4  호출·정산·감사</text>
<text x="527" y="628" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="14" font-weight="400" fill="#163c2c" text-anchor="middle">에이전트 근처 또는 공유 게이트웨이</text>
<text x="940" y="502" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="22" font-weight="700" fill="#163c2c" text-anchor="middle">승인된 공급자</text>
<text x="940" y="535" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="17" font-weight="400" fill="#163c2c" text-anchor="middle">내부 모델 목적지</text>
<text x="940" y="565" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="17" font-weight="400" fill="#163c2c" text-anchor="middle">외부 모델 목적지</text>
<text x="940" y="602" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="15" font-weight="400" fill="#163c2c" text-anchor="middle">정책이 허용한 경로만 사용</text>
