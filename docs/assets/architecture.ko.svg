<svg xmlns="http://www.w3.org/2000/svg" lang="ko" xml:lang="ko" viewBox="0 0 1120 880" role="img" aria-labelledby="title desc">
<title id="title">inferplane: 제어 영역과 데이터 영역 분리</title>
<desc id="desc">제어 영역은 정책과 유한 예산 권한을 배포하고 사용량을 받습니다. 프롬프트는 에이전트에서 mayu를 거쳐 공급자로만 전달됩니다. 공유 Postgres 모드의 동기 승인 경로는 별도로 표시됩니다. 로컬·노드별 영속 모드는 로컬 승인 상태를 사용하며 각 게이트웨이는 자체 감사 기록을 보관합니다.</desc>
<defs>
<marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#047857" stroke-width="1.5"/></marker>
<marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#315c93" stroke-width="1.5"/></marker>
<marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#996013" stroke-width="1.5"/></marker>
<marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#a43c3c" stroke-width="1.5"/></marker>
<marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#64746b" stroke-width="1.5"/></marker>
</defs>
<rect width="1120" height="880" rx="16" fill="#f0f5f2"/>
<text x="32" y="42" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="27" font-weight="700" fill="#163c2c" text-anchor="start">정책은 중앙에서 관리하고, 요청 경로에서 자동 집행합니다.</text>
<text x="32" y="70" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="17" font-weight="400" fill="#163c2c" text-anchor="start">두 바이너리의 역할을 나누고 회계 프로파일별 의존성을 명확히 합니다.</text>
<rect x="24" y="94" width="1072" height="221" rx="12" fill="#e8eff8" stroke="#c1d0e5" stroke-width="1.5" stroke-dasharray=""/>
<text x="46" y="125" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="700" fill="#315c93" text-anchor="start">제어 영역 · 정책 관리와 예산 사용 권한</text>
<rect x="46" y="150" width="242" height="126" rx="12" fill="#fff" stroke="#c1d4c9" stroke-width="1.5" stroke-dasharray=""/>
<rect x="364" y="150" width="320" height="126" rx="12" fill="#fff" stroke="#315c93" stroke-width="1.5" stroke-dasharray=""/>
<rect x="794" y="150" width="278" height="126" rx="12" fill="#fff" stroke="#c1d4c9" stroke-width="1.5" stroke-dasharray=""/>
<text x="167" y="185" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="23" font-weight="700" fill="#163c2c" text-anchor="middle">운영자</text>
<text x="167" y="216" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="middle">GovernancePolicy</text>
<text x="167" y="244" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="middle">접근 · 예산 · 개인정보 보호</text>
<text x="524" y="185" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="23" font-weight="700" fill="#163c2c" text-anchor="middle">inferplaned</text>
<text x="524" y="216" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="middle">정책과 예산 사용 권한 배포</text>
<text x="524" y="244" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="middle">사용량 텔레메트리 수신</text>
<text x="933" y="185" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="23" font-weight="700" fill="#163c2c" text-anchor="middle">Postgres</text>
<text x="933" y="216" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="middle">영속 예산 / 공유 프로파일</text>
<text x="933" y="244" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="middle">정책과 예산 권한 상태</text>
<path d="M288 214H357" fill="none" stroke="#315c93" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#blue)"/>
<path d="M684 214H787" fill="none" stroke="#315c93" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#blue)"/>
<text x="325" y="197" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="14" font-weight="400" fill="#163c2c" text-anchor="middle">규칙</text>
<text x="740" y="197" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="14" font-weight="400" fill="#163c2c" text-anchor="middle">예산 권한</text>
<rect x="24" y="387" width="1072" height="293" rx="12" fill="#e6f2eb" stroke="#b5d4c2" stroke-width="1.5" stroke-dasharray=""/>
<text x="46" y="418" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="700" fill="#047857" text-anchor="start">데이터 영역 · 추론과 요청별 자동 집행</text>
<rect x="46" y="486" width="235" height="112" rx="12" fill="#fff" stroke="#c1d4c9" stroke-width="1.5" stroke-dasharray=""/>
