<path d="M697 551H801" fill="none" stroke="#047857" stroke-width="2.2" stroke-dasharray="" marker-end="url(#green)"/>
<text x="320" y="535" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="13" font-weight="400" fill="#163c2c" text-anchor="middle">요청</text>
<text x="752" y="535" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="13" font-weight="400" fill="#163c2c" text-anchor="middle">승인 경로</text>
<path d="M461 276V440" fill="none" stroke="#315c93" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#blue)"/>
<path d="M608 447V283" fill="none" stroke="#315c93" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#blue)"/>
<text x="441" y="344" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="end">정책 + 유한</text>
<text x="441" y="367" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="end">예산 사용 권한</text>
<text x="628" y="344" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="start">사용량</text>
<text x="628" y="367" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="start">보고</text>
