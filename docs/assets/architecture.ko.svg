<rect x="785" y="332" width="292" height="58" rx="12" fill="#fff9ee" stroke="#ddc291" stroke-width="1.5" stroke-dasharray=""/>
<text x="931" y="355" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="600" fill="#79501d" text-anchor="middle">ADR-046 전용 · 동기 호출</text>
<text x="931" y="378" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="15" font-weight="400" fill="#79501d" text-anchor="middle">키 조회 + 자원 사용 승인</text>
<rect x="46" y="723" width="644" height="88" rx="12" fill="#fff" stroke="#c1d4c9" stroke-width="1.5" stroke-dasharray=""/>
<rect x="744" y="723" width="328" height="88" rx="12" fill="#fff" stroke="#c1d4c9" stroke-width="1.5" stroke-dasharray=""/>
<path d="M527 646V716" fill="none" stroke="#64746b" stroke-width="2.2" stroke-dasharray="" marker-end="url(#gray)"/>
<text x="66" y="752" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="18" font-weight="700" fill="#163c2c" text-anchor="start">로컬 승인 상태</text>
<text x="66" y="777" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="start">기본: 로컬 카운터 · ADR-045: 비공개 예산 권한 저널</text>
<text x="66" y="799" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="14" font-weight="400" fill="#163c2c" text-anchor="start">ADR-046은 공유 Postgres에서 동기 승인합니다.</text>
<text x="908" y="752" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="18" font-weight="700" fill="#163c2c" text-anchor="middle">게이트웨이별 기록</text>
<text x="908" y="778" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="middle">감사 WAL · 메트릭 · 사용량</text>
<path d="M658 646V699H908V716" fill="none" stroke="#64746b" stroke-width="2.2" stroke-dasharray="" marker-end="url(#gray)"/>
<text x="32" y="848" font-family="'Noto Sans CJK KR',system-ui,sans-serif" font-size="15" font-weight="400" fill="#163c2c" text-anchor="start">토폴로지·가격·경계 라벨은 운영자가 설정합니다. 제어 영역 장애와 DB 장애는 다르며 프로파일별 승인 조건이 적용됩니다.</text>
