<text x="524" y="216" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="middle">Distribute policy + authority</text>
<text x="524" y="244" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="middle">Receive usage telemetry</text>
