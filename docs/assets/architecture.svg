<text x="167" y="579" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="middle">OpenCode · virtual keys</text>
<text x="527" y="480" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#163c2c" text-anchor="middle">mayu</text>
<text x="378" y="511" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="start">1  Access + local PII inspection</text>
<text x="378" y="540" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="start">2  Privacy / budget / context route</text>
