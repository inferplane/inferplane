<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" viewBox="0 0 1120 880" role="img" aria-labelledby="title desc">
<title id="title">inferplane: separate control and data planes</title>
<desc id="desc">The control plane distributes policy and finite budget authority and receives usage. Prompts travel only from agents through mayu to providers. Shared Postgres has an explicit synchronous admission edge. Local and durable node-local modes use local admission state. Every gateway keeps its own audit evidence.</desc>
<defs>
<marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#047857" stroke-width="1.5"/></marker>
<marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#315c93" stroke-width="1.5"/></marker>
<marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#996013" stroke-width="1.5"/></marker>
<marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#a43c3c" stroke-width="1.5"/></marker>
<marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#64746b" stroke-width="1.5"/></marker>
</defs>
<rect width="1120" height="880" rx="16" fill="#f0f5f2"/>
<text x="32" y="42" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#163c2c" text-anchor="start">Manage centrally. Enforce on the inference path.</text>
<text x="32" y="70" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#163c2c" text-anchor="start">Two binaries, distinct responsibilities, explicit accounting dependencies.</text>
