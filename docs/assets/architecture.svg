<text x="167" y="216" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="middle">GovernancePolicy</text>
<text x="167" y="244" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#163c2c" text-anchor="middle">Access · budgets · privacy</text>
