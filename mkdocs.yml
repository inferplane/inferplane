site_name: inferplane
site_description: Separate policy management from inference. Automate model access, budget cutover, PII routing, and audit.
site_url: https://inferplane.github.io/inferplane/
repo_url: https://github.com/inferplane/inferplane
repo_name: inferplane/inferplane
edit_uri: edit/main/docs/
copyright: Copyright © inferplane contributors · Apache-2.0
strict: true
exclude_docs: |
  /superpowers/
  /specs/
  /customer-issue-analysis.md
  /overrides/
hooks:
  - scripts/docs_hooks.py
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
theme:
  name: material
  language: en
  logo: assets/mark.svg
  favicon: assets/mark.svg
  font: false
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
        - locale: ko
          name: 한국어
          copyright: Copyright © inferplane 기여자 · Apache-2.0
          site_description: 정책 관리와 추론 경로를 분리하고 모델 접근, 예산 전환, PII 라우팅과 감사를 요청마다 자동 집행하세요.
          theme:
            palette:
              - scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-night
                  name: 어두운 테마로 전환
              - scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-sunny
                  name: 밝은 테마로 전환
          nav_translations:
            Overview: 소개
            Why inferplane: inferplane의 강점
            Get started: 시작하기
            First request: 첫 요청 보내기
            Choose a deployment profile: 배포 프로파일 선택
            Connect clients: 클라이언트 연결
            Feature support: 기능 지원 범위
            Guides: 사용 가이드
            Model routing & privacy: 모델 라우팅과 개인정보 보호
            Adaptive coding workflows: 적응형 코딩 워크플로
            Verified identity: 검증된 사용자 식별
            Durable budgets: 영속 전역 예산
            Shared governance: 공유 거버넌스
            Codex launcher: Codex 실행 도구
            CLI login: CLI 로그인
            Credential brokering: 자격 증명 중개
            Console SSO: 콘솔 SSO
            Operations: 운영
            Deploy with containers: 컨테이너 배포
            Monitor & troubleshoot: 모니터링과 문제 해결
            Upgrade & recover: 업그레이드와 복구
            Production readiness: 상용화 준비도
            Security boundaries: 보안 경계
            Audit anchoring: 감사 앵커링
            Body key rotation: 본문 암호화 키 교체
            Reference: 레퍼런스
            HTTP & CLI: HTTP와 CLI
            Architecture: 아키텍처
            Implementation: 구현 레퍼런스
            Index: 색인
            Infrastructure: 인프라
            API: API
            Data: 데이터
            Security: 보안
            Providers & agents: 공급자와 에이전트
            Architecture decisions: 설계 결정 기록
            Project: 프로젝트
            Contributing: 기여하기
            Maintain the documentation: 문서 관리
            Product direction: 제품 방향
            Roadmap: 로드맵
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
extra_css:
  - assets/stylesheets/extra.css
extra:
  generator: false
nav:
  - Overview: index.md
  - Get started:
      - Why inferplane: why-inferplane.md
      - First request: getting-started/quickstart.md
      - Choose a deployment profile: getting-started/deployment-profiles.md
      - Connect clients: getting-started/clients.md
      - Feature support: getting-started/support-matrix.md
  - Guides:
      - Model routing & privacy: policy-routing.md
      - Adaptive coding workflows: adaptive-routing.md
      - Verified identity: verified-identity.md
      - Durable budgets: durable-budgets.md
      - Shared governance: shared-governance.md
      - Codex launcher: codex-launcher.md
      - CLI login: runbooks/cli-login.md
      - Credential brokering: runbooks/credential-brokering.md
      - Console SSO: runbooks/inferplaned-console-sso.md
  - Operations:
      - Deploy with containers: operations/deployment.md
      - Monitor & troubleshoot: operations/observability.md
      - Upgrade & recover: operations/recovery.md
      - Production readiness: operations/production-readiness.md
      - Security boundaries: operations/security.md
      - Audit anchoring: runbooks/audit-anchoring.md
      - Body key rotation: runbooks/body-key-rotation.md
  - Reference:
      - HTTP & CLI: api-reference.md
      - Architecture: architecture.md
      - Implementation:
          - Index: reference/INDEX.md
          - Infrastructure: reference/infrastructure.md
          - API: reference/api.md
          - Data: reference/data.md
          - Security: reference/security.md
          - Providers & agents: reference/agent-llm.md
      - Architecture decisions: decisions/index.md
  - Project:
      - Contributing: onboarding.md
      - Maintain the documentation: documentation.md
      - Product direction: enterprise-strategy.md
      - Roadmap: roadmap.md
