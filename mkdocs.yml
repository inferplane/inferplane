site_name: inferplane
site_description: Govern coding-agent traffic with model routing, identity, budgets, and auditable decisions.
site_url: https://inferplane.github.io/inferplane/
repo_url: https://github.com/inferplane/inferplane
repo_name: inferplane/inferplane
edit_uri: edit/main/docs/
copyright: Copyright © inferplane contributors · Apache-2.0
strict: true
exclude_docs: |
  /superpowers/
  /specs/
  /customer-issue-analysis.md
  /overrides/
hooks:
  - scripts/docs_hooks.py
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
theme:
  name: material
  language: en
  logo: assets/mark.svg
  favicon: assets/mark.svg
  font: false
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - assets/stylesheets/extra.css
extra:
  generator: false
nav:
  - Overview: index.md
  - Get started:
      - First request: getting-started/quickstart.md
      - Choose a deployment profile: getting-started/deployment-profiles.md
      - Connect clients: getting-started/clients.md
      - Feature support: getting-started/support-matrix.md
  - Guides:
      - Model routing & privacy: policy-routing.md
      - Adaptive coding workflows: adaptive-routing.md
      - Verified identity: verified-identity.md
      - Durable budgets: durable-budgets.md
      - Shared governance: shared-governance.md
      - Codex launcher: codex-launcher.md
      - CLI login: runbooks/cli-login.md
      - Credential brokering: runbooks/credential-brokering.md
      - Console SSO: runbooks/inferplaned-console-sso.md
  - Operations:
      - Deploy with containers: operations/deployment.md
      - Monitor & troubleshoot: operations/observability.md
      - Upgrade & recover: operations/recovery.md
      - Production readiness: operations/production-readiness.md
      - Security boundaries: operations/security.md
      - Audit anchoring: runbooks/audit-anchoring.md
      - Body key rotation: runbooks/body-key-rotation.md
  - Reference:
      - HTTP & CLI: api-reference.md
      - Architecture: architecture.md
      - Implementation:
          - Index: reference/INDEX.md
          - Infrastructure: reference/infrastructure.md
          - API: reference/api.md
          - Data: reference/data.md
          - Security: reference/security.md
          - Providers & agents: reference/agent-llm.md
      - Architecture decisions: decisions/index.md
  - Project:
      - Contributing: onboarding.md
      - Maintain the documentation: documentation.md
      - Product direction: enterprise-strategy.md
      - Roadmap: roadmap.md
