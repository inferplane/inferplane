# Control-plane demo policy for the inferplaned ECS deployment (inferplane-demo).
# Distinct from examples/policies/demo.yaml (that one documents the local
# file-channel model names); this one matches the actual model ids the
# itrust demo requests via Bedrock global inference profiles.
apiVersion: inferplane.dev/v1alpha1
kind: GovernancePolicy
metadata:
  name: demo-team
spec:
  subject:
    team: demo
  rules:
  - name: monthly-hard-cap
    failurePolicy: FailClosed
    budget:
      limitMilliUSD: 50000
      hardCap: true
      lease:
        # Hand out the full $50 cap on the first lease, no trickle. Assumes a
        # single data plane (this devbox's mayu): the first dataplane to renew
        # claims the whole remaining budget, so a second one would be granted
        # 0 and immediately fail closed (hardCap+FailClosed). If a second
        # dataplane joins, lower grantMilliUSD and add renewInterval: "30s".
        grantMilliUSD: 50000
      adminContact: "atomoh@inferplane.dev"
  - name: throughput
    failurePolicy: FailOpen
    rate:
      rpm: 300
      tpm: 2000000
  - name: models
    failurePolicy: FailOpen
    modelAccess:
      allow: ["*"]
