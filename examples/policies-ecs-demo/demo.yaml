# Control-plane demo policy for the inferplaned ECS deployment (inferplane-demo).
# Distinct from examples/policies/demo.yaml (that one documents the local
# file-channel model names); this one matches the actual model ids the
# itrust demo requests via Bedrock global inference profiles.
apiVersion: inferplane.dev/v1alpha1
kind: GovernancePolicy
metadata:
  name: demo-team
spec:
  subject:
    team: demo
  rules:
  # No budget rule for team demo: the policy schema requires limitMilliUSD >
  # 0 (no rule = no cap is the only "unlimited" the schema supports), so
  # spend is unbounded here. Re-add a `budget:` rule (see git history for the
  # $50 monthly-hard-cap shape) to reinstate a cap.
  - name: throughput
    failurePolicy: FailOpen
    rate:
      rpm: 300
      tpm: 2000000
  - name: models
    failurePolicy: FailOpen
    modelAccess:
      allow: ["*"]
