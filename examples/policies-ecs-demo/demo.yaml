# Control-plane demo policy for the inferplaned ECS deployment (inferplane-demo).
# Distinct from examples/policies/demo.yaml (that one documents the local
# file-channel model names); this one matches the actual model ids the
# itrust demo requests via Bedrock global inference profiles.
apiVersion: inferplane.dev/v1alpha1
kind: GovernancePolicy
metadata:
  name: demo-team
spec:
  subject:
    team: demo
  rules:
  # Explicit "no cap" (ADR-039) rather than simply omitting the rule: the
  # declaration itself is auditable, and the rule keeps its place in the
  # document instead of disappearing from the diff. Re-add limitMilliUSD
  # (see git history for the $50 monthly-hard-cap shape) to reinstate a cap.
  - name: budget
    failurePolicy: FailOpen
    budget:
      unlimited: true
  # `unlimited` is window-agnostic — "no cap" is a statement about the budget
  # dimension as a whole, not about one calendar window, so combining it with
  # `period` is rejected at load. If this demo ever takes a real cap, the
  # day+month shape is two rules, one per window, because hardCap /
  # failurePolicy / lease are per-rule and each window carries its own lease:
  #
  # - name: daily-soft-cap
  #   failurePolicy: FailOpen
  #   budget:
  #     period: CalendarDay
  #     limitMilliUSD: 5000            # $5 / day (1000 = $1)
  # - name: monthly-hard-cap
  #   failurePolicy: FailClosed
  #   budget:
  #     limitMilliUSD: 50000           # $50 / month; period omitted = CalendarMonth
  #     hardCap: true
  # The previous fixed 2M tpm choked Claude Code's cache-creation bursts
  # (150k+ tokens per request) with team_token_rate_limited 429s, because
  # PreCheck's estimate counted the full cached prefix even on a cache hit —
  # ADR-039 now trues TPM up against real usage post-response, but this demo
  # still declares no cap explicitly rather than guessing a number without
  # live traffic to validate it against.
  - name: throughput
    failurePolicy: FailOpen
    rate:
      unlimited: true
  - name: models
    failurePolicy: FailOpen
    modelAccess:
      allow: ["*"]
