# Local GovernancePolicy documents (api/v1alpha1, ADR-032/033).
# Enable by adding to config.json:   "policies": ["examples/policies/"]
# Files are watched: save a change and it applies within ~2 seconds.
# Money is integer milliUSD: 1000 = $1.
apiVersion: inferplane.dev/v1alpha1
kind: GovernancePolicy
metadata:
  name: demo-team
spec:
  subject:
    team: demo            # organizational unit (department)
  rules:
  - name: daily-soft-cap
    failurePolicy: FailOpen            # soft budgets fail open
    budget:
      period: CalendarDay              # resets at midnight in budget_timezone
      limitMilliUSD: 5000              # $5 / day
  - name: monthly-hard-cap
    failurePolicy: FailClosed          # hard caps must be FailClosed
    budget:
      # period omitted → CalendarMonth: documents written before `period`
      # existed keep their exact meaning
      limitMilliUSD: 50000             # $50 / month
      hardCap: true
      # lease omitted → defaults: grant 0.1% of limit, renew every 10s
  - name: throughput
    failurePolicy: FailOpen
    rate:
      rpm: 300
      tpm: 2000000
  - name: models
    failurePolicy: FailOpen
    modelAccess:
      allow: ["claude-sonnet-4-6", "claude-haiku-4-5"]   # "*" = all
  - name: downgrade-subagents-at-80
    failurePolicy: FailOpen
    # ADR-041: once monthly-hard-cap crosses 80% utilization (judged
    # globally by the control plane), subagent/background traffic
    # requesting claude-haiku-4-5 is served by a self-hosted vLLM model
    # instead — a nominal, operator-entered chargeback rate, never a free
    # model (ADR-030/ADR-039). The main-loop model is deliberately absent
    # from this map: substitution is keyed by requested model name, and
    # only short-lived (subagent) conversations are safe to retarget
    # without a prompt-cache miss on a live session.
    routing:
      budgetTiers:
        budgetRef: monthly-hard-cap
        tiers:
        - thresholdPercent: 80
          substitute:
            claude-haiku-4-5: glm-4.7-gpu
---
# User-subject policy: applies wherever this identity appears (a virtual
# key's owner today; OIDC sub with the control plane). Matching team AND
# user policies both apply — the most restrictive outcome wins.
apiVersion: inferplane.dev/v1alpha1
kind: GovernancePolicy
metadata:
  name: demo-intern
spec:
  subject:
    user: intern-01
  rules:
  - name: haiku-only
    failurePolicy: FailOpen
    modelAccess:
      allow: ["claude-haiku-4-5"]
