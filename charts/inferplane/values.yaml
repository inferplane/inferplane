image:
  repository: inferplane
  tag: "0.2.0"
  pullPolicy: IfNotPresent
replicaCount: 1   # Values >1 require the explicit Postgres shared-governance profile.
                  # See examples/helm.shared-governance.yaml and docs/shared-governance.md.
                  # Default SQLite/in-memory mode remains single-replica.
service:
  dataPort: 8080
  adminPort: 9090
serviceAccount:
  create: true
  name: ""
  annotations: {}   # e.g. eks.amazonaws.com/role-arn for Bedrock IRSA
# Writable data volumes for the image's nonroot UID/GID. The CSI driver must
# support fsGroup ownership; pre-provision existing claims accordingly.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: ["ALL"] }
# Synchronous audit/analytics replay precedes HTTP listeners. Allow up to ten
# minutes before liveness begins; tune for the largest retained audit history.
startupProbe:
  httpGet: { path: /healthz, port: admin }
  periodSeconds: 5
  failureThreshold: 120
  timeoutSeconds: 2
persistence:
  enabled: false   # opt in for production — without it /var/lib/inferplane is an
                   # emptyDir and the key store/audit WAL are wiped on every restart
  existingClaim: ""
  size: 1Gi
  storageClass: ""
  accessMode: ReadWriteOnce
# Shared profile + persistence renders a StatefulSet with a separate claim per
# replica. Collect audit segments from every replica; never share an audit WAL.
# Off by default: the data plane needs a host to be genuinely useful, and the
# admin plane defaults to OFF even when ingress.enabled is true (see admin.enabled
# below) because it carries key-issuance/governance actions and should stay on a
# restricted path (kubectl port-forward, a VPN-only Ingress class, etc.) unless
# you've deliberately decided otherwise.
ingress:
  enabled: false
  className: ""
  annotations: {}
  data:
    host: ""            # e.g. inferplane.example.com
    path: /
    pathType: Prefix
  admin:
    enabled: false       # opt in explicitly to expose /admin/* beyond the cluster
    host: ""             # e.g. inferplane-admin.example.com
    path: /
    pathType: Prefix
  tls: []                 # [{ secretName: inferplane-tls, hosts: [inferplane.example.com] }]
# Secrets are referenced, never created by this chart (§7). Provide via existingSecret:
#   kubectl create secret generic inferplane-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=INFERPLANE_ADMIN_TOKEN=admin-secret
secrets:
  existingSecret: inferplane-secrets   # must contain ANTHROPIC_API_KEY, INFERPLANE_ADMIN_TOKEN, ...
# config.json rendered into a ConfigMap. Secrets use api_key_ref env: from existingSecret.
config:
  server:
    listen: ":8080"
    admin_listen: ":9090"
    admin_auth:
      token_refs: [ { env: INFERPLANE_ADMIN_TOKEN } ]
  key_store: { type: sqlite, path: /var/lib/inferplane/keys.db }
  # To preload virtual keys, add entries like this and put INFERPLANE_VIRTUAL_KEY
  # in secrets.existingSecret; the chart exposes that Secret through envFrom.
  # virtual_keys:
  #   - team: demo
  #     key_ref: { env: INFERPLANE_VIRTUAL_KEY }
  #     allowed_models: ["*"]
  providers:
    anthropic-direct:
      type: anthropic
      base_url: https://api.anthropic.com
      api_key_ref: { env: ANTHROPIC_API_KEY }
  models:
    claude-sonnet-4-6:
      targets: [ { provider: anthropic-direct, model: claude-sonnet-4-6 } ]
  # Audit: records go to container stdout, collected off the node by an OTel
  # Collector filelog receiver (examples/otel-collector/audit-filelog.yaml);
  # kubelet log rotation bounds local disk. Nothing grows on the pod volume:
  # the WAL is truncated after each delivered record. stdout is best-effort
  # (not a required sink), so the container log file is the only local copy
  # until the collector durably enqueues it. The collector's persistent queue
  # holds a separate copy pending export; size kubelet rotation for ingestion outages.
  audit:
    failure_mode: buffer_then_block
    buffer: { path: /var/lib/inferplane/audit.wal }
    sinks: [ { type: stdout } ]
  # The local analytics index (GET /admin/logs, console usage) has no retention
  # and grows with traffic; keep it off here and query the collected records,
  # or use the shared Postgres store (analytics.mode_b, ADR-015).
  analytics: { disabled: true }
  # Opt-in OTLP TRACE export (ADR-011). Traces are the only signal mayu speaks
  # OTLP: metrics stay Prometheus exposition on the admin port (scrape
  # http://<svc>:9090/metrics — the Service's named `admin` port), and usage
  # windows go to inferplaned over `POST /v1alpha1/usage`, not OTLP. Absent
  # (the default) → no tracer, request path byte-identical.
  # otel:
  #   endpoint: otel-collector.observability.svc.cluster.local:4318
  #   protocol: http        # or grpc (:4317)
  #   insecure: true        # in-cluster plaintext to the collector
  #   sample_ratio: 0.1     # omit for 1.0; explicit 0.0 samples none
  #   service_name: inferplane
# Measured 2026-09-25 (fake upstream, 2–200 KB requests): RSS 27 MB idle, 79 MB
# peak at >1,000 req/s; CPU 0.8–8.5 ms per request, scaling with body size.
# These figures do not cover the default 64 MiB body cap, concurrent large
# requests, privacy inspection or audit replay. Size memory for your workload
# and lower config.server.max_request_bytes when large bodies are unnecessary.
# No CPU limit: throttling would add latency to every in-flight stream.
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 256Mi }

# Opt-in Korean PII classifier sidecar (examples/pii-classifier-ko). It runs
# laya-serve with a checkpoint you fine-tune and bake into your own image (none
# is published; build it from examples/pii-classifier-ko/laya-serve) and listens
# on 127.0.0.1 inside the pod only: no Service port, no containerPort. Point
# config.pii_classification at http://127.0.0.1:<port>
# (examples/helm.pii-classifier-ko.yaml). Off by default.
# Measured 2026-10-16 on CPU: ready in about 14 s; RSS 2.0 GiB idle, 2.6 GiB
# peak; about 0.5 s per 1,000-character Korean window (an evaluation profile).
# Sizing: per-key rate and budget limits do not bound classifier load, because
# classification runs during routing, before admission; each gateway request
# can cost up to max_windows inferences. laya-serve admits LAYA_MAX_CONCURRENT
# requests at once (default 16), answers the rest with 503 and runs one
# inference at a time. Saturation fails closed in Enforce and adds up to
# timeout_ms of latency in Shadow.
# The chart never sets LAYA_JEV_STRICT; keep it unset. It strips the usage
# truncation fields the gateway reads, and every result would then abstain.
piiClassifier:
  laya:
    enabled: false
    image:
      repository: ""      # required when enabled: your private registry
      digest: ""          # required when enabled: sha256:...
    port: 8095
    threads: 2
    # Optional Secret with key LAYA_API_KEY; the sidecar then requires
    # "Authorization: Bearer <key>". The gateway container loads every key of
    # secrets.existingSecret as env (envFrom), so put the same LAYA_API_KEY there
    # (or name that Secret here) and set api_key_ref: {env: LAYA_API_KEY} on the
    # classifier in config.pii_classification.
    apiKeySecret: ""
    # No CPU limit: throttling adds latency to every classified request.
    resources:
      requests: { cpu: "2", memory: 3Gi }
      limits: { memory: 4Gi }

# GovernancePolicy documents (api/v1alpha1, ADR-033/035): filename → document
# body (multi-doc YAML allowed). Rendered into a ConfigMap mounted at
# /etc/inferplane/policies; add `policies: ["/etc/inferplane/policies"]` to
# `config` above to enforce them. ConfigMap edits reach the pod via kubelet
# sync (~1 min) and apply live — no restart. The same documents also install
# as CRDs (deploy/crd/) for kubectl-native validation.
policies: {}
