{{- $shared := and (eq (default "" .Values.config.key_store.type) "postgres") (eq (dig "governance_store" "type" "" .Values.config) "postgres") }}
{{- $stateful := and $shared .Values.persistence.enabled }}
{{- if lt (int .Values.replicaCount) 1 }}{{- fail "replicaCount must be positive" }}{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) (not $shared) }}{{- fail "replicaCount>1 requires Postgres key_store and governance_store" }}{{- end }}
{{- if $shared }}
{{- if not (dig "control_plane" "require_sync" false .Values.config) }}{{- fail "shared governance requires control_plane.require_sync" }}{{- end }}
{{- if or (dig "control_plane" "authority" false .Values.config) .Values.config.provider_store }}{{- fail "shared governance cannot use node-local authority or provider_store" }}{{- end }}
{{- if and $stateful .Values.persistence.existingClaim }}{{- fail "shared persistent replicas require separate generated PVCs, not existingClaim" }}{{- end }}
{{- end }}
apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" $stateful }}
metadata:
  name: {{ include "inferplane.fullname" . }}
  labels:
    {{- include "inferplane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if $stateful }}
  serviceName: {{ include "inferplane.fullname" . }}-headless
  {{- else if .Values.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "inferplane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inferplane.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "inferplane.serviceAccountName" . }}
      {{- if gt (int .Values.replicaCount) 1 }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "inferplane.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: inferplane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/inferplane/config.json"]
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          ports:
            - name: data
              containerPort: {{ .Values.service.dataPort }}
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/inferplane
            - name: data
              mountPath: /var/lib/inferplane
            {{- if .Values.policies }}
            - name: policies
              mountPath: /etc/inferplane/policies
              readOnly: true
            {{- end }}
        {{- with .Values.piiClassifier }}{{- with .laya }}{{- if .enabled }}
        {{- if not .image.repository }}{{- fail "piiClassifier.laya.image.repository is required when the sidecar is enabled: no image is published, build one from examples/pii-classifier-ko/laya-serve" }}{{- end }}
        {{- if not .image.digest }}{{- fail "piiClassifier.laya.image.digest is required when the sidecar is enabled" }}{{- end }}
        - name: laya-ko-pii
          image: "{{ .image.repository }}@{{ .image.digest }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: LAYA_HOST
              value: "127.0.0.1"
            - name: LAYA_PORT
              value: {{ .port | quote }}
            - name: LAYA_THREADS
              value: {{ .threads | quote }}
            {{- if .apiKeySecret }}
            - name: LAYA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .apiKeySecret }}
                  key: LAYA_API_KEY
            {{- end }}
          # The server binds 127.0.0.1, so probes run inside the container
          # rather than from the kubelet against the pod IP.
          startupProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:{{ .port }}/health', timeout=2)"]
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:{{ .port }}/health', timeout=2)"]
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - name: laya-tmp
              mountPath: /tmp
        {{- end }}{{- end }}{{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "inferplane.fullname" . }}-config
        {{- if .Values.policies }}
        - name: policies
          configMap:
            name: {{ include "inferplane.fullname" . }}-policies
        {{- end }}
        {{- if not $stateful }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "inferplane.fullname" .)) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if dig "laya" "enabled" false (default dict .Values.piiClassifier) }}
        - name: laya-tmp
          emptyDir: {}
        {{- end }}
  {{- if $stateful }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [{{ .Values.persistence.accessMode | quote }}]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
