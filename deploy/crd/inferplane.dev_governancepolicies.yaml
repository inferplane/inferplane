# GovernancePolicy CRD (ADR-035): registers the api/v1alpha1 schema with a
# Kubernetes API server so policy documents are kubectl-native — authored,
# validated (structural schema + CEL rules mirroring internal/policy), and
# stored as cluster objects. The SAME document body works on every channel:
# a local file (`policies` config key), the control-plane push (ADR-034), or
# this CRD. Today enforcement in-cluster flows through the Helm chart's
# policies ConfigMap (kubectl/helm edit → kubelet syncs the mounted file →
# mayu's watcher applies it); the inferplaned CRD-watch controller is the
# follow-up that consumes these objects directly.
#
# CEL validation rules require Kubernetes 1.25+.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: governancepolicies.inferplane.dev
spec:
  group: inferplane.dev
  scope: Namespaced
  names:
    kind: GovernancePolicy
    listKind: GovernancePolicyList
    plural: governancepolicies
    singular: governancepolicy
    shortNames: ["gp"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Team
          type: string
          jsonPath: .spec.subject.team
        - name: User
          type: string
          jsonPath: .spec.subject.user
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["subject", "rules"]
              properties:
                subject:
                  type: object
                  x-kubernetes-validations:
                    - rule: "has(self.team) || has(self.user)"
                      message: "subject must select a team and/or a user"
                  properties:
                    team:
                      type: string
                      minLength: 1
                    user:
                      type: string
                      minLength: 1
                rules:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: ["name", "failurePolicy"]
                    x-kubernetes-validations:
                      # Exactly one rule kind — mirrors internal/policy.
                      - rule: "[has(self.budget), has(self.routing), has(self.modelAccess), has(self.rate)].filter(x, x).size() == 1"
                        message: "exactly one of budget, routing, modelAccess, or rate must be set"
                      # A hard-cap budget rule must fail closed (ADR-032).
                      - rule: "!has(self.budget) || !(has(self.budget.hardCap) && self.budget.hardCap) || self.failurePolicy == 'FailClosed'"
                        message: "a hard-cap budget rule must be FailClosed"
                    properties:
                      name:
                        type: string
                        minLength: 1
                      failurePolicy:
                        type: string
                        enum: ["FailOpen", "FailClosed"]
                      budget:
                        type: object
                        required: ["limitMilliUSD"]
                        properties:
                          # Money is integer milliUSD: 1000 = $1 (ADR-032).
                          limitMilliUSD:
                            type: integer
                            format: int64
                            minimum: 1
                          hardCap:
                            type: boolean
                          lease:
                            type: object
                            properties:
                              grantMilliUSD:
                                type: integer
                                format: int64
                                minimum: 0
                              renewInterval:
                                type: string
                                # Go duration, e.g. "10s", "1m30s".
                                pattern: "^([0-9]+(\\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$"
                      routing:
                        type: object
                        required: ["onAffinityConflict"]
                        properties:
                          onAffinityConflict:
                            type: string
                            enum: ["PreferAffinity", "PreferFallback"]
                      modelAccess:
                        type: object
                        required: ["allow"]
                        properties:
                          allow:
                            type: array
                            minItems: 1
                            items:
                              type: string
                              minLength: 1
                      rate:
                        type: object
                        x-kubernetes-validations:
                          - rule: "(has(self.rpm) && self.rpm > 0) || (has(self.tpm) && self.tpm > 0)"
                            message: "rate must limit at least one of rpm or tpm"
                        properties:
                          rpm:
                            type: integer
                            format: int64
                            minimum: 0
                          tpm:
                            type: integer
                            format: int64
                            minimum: 0
